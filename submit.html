<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submit Project — Expo 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="apple-touch-icon" href="school_logo.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<nav class="nav"><div class="container" id="nav"></div></nav>

<section style="padding:60px 0">
  <div class="container">
    <div style="text-align:center;margin-bottom:36px">
      <div class="kicker">Submit</div>
      <h1 style="font-size:clamp(30px,4vw,44px);margin:0 0 8px;letter-spacing:-0.02em;font-weight:800">Share your project</h1>
      <p style="color:var(--muted);max-width:560px;margin:0 auto">Fill out the form below. Your submission will be reviewed by the admin panel before going live.</p>
    </div>
    <div class="glass form-card">
      <form id="form">
        <div class="form-grid">
          <div class="field"><label>Project Title *</label><input name="title" required placeholder="Your project title" /></div>
          <div class="field"><label>Category *</label>
            <select name="category" required></select>
          </div>
          <div class="field"><label>Your Name *</label><input name="studentName" required placeholder="Full name" /></div>
          <div class="field"><label>Grade / Class *</label><input name="grade" required placeholder="e.g. Grade 11" /></div>
          <div class="field"><label>Email</label><input name="email" type="email" placeholder="you@school.edu" /></div>
          <div class="field"><label>Image URL</label><input name="imageUrl" placeholder="https://..." /><div class="hint">Paste a hosted image link (Unsplash etc.)</div></div>
          <div class="field full"><label>Description *</label><textarea name="description" required placeholder="Describe your project, what it does, and the impact..."></textarea></div>
          <div class="field"><label>Live Demo URL</label><input name="demoUrl" placeholder="https://..." /></div>
          <div class="field"><label>Repository URL</label><input name="repoUrl" placeholder="https://github.com/..." /></div>
          <div class="field full"><label>Tags</label><input name="tags" placeholder="Comma separated, e.g. AI, Python, Web" /></div>
        </div>
        <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end">
          <a class="btn btn-ghost" href="projects.html">Cancel</a>
          <button class="btn btn-primary" type="submit">Submit for Review</button>
        </div>
      </form>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script src="js/store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script src="js/app.js"></script>
<script>
  ExpoUI.renderNav(document.getElementById('nav'));
  ExpoUI.renderFooter(document.getElementById('footer'));
  const S = window.ExpoStore;
  const sel = document.querySelector('select[name=category]');
  sel.innerHTML = S.CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');

  S.ready().then(() => document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    data.tags = (data.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    if (!data.demoUrl) data.demoUrl = '#';
    if (!data.repoUrl) data.repoUrl = '#';
    if (!data.imageUrl) data.imageUrl = '';
    S.addProject(data);
    ExpoUI.toast('Project submitted for review!', 'success');
    setTimeout(() => location.href = 'projects.html', 900);
  }));
</script>
</body>
</html>
