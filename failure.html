<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Something went wrong — Expo 2026</title>
<meta name="theme-color" content="#f4f1e9" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="apple-touch-icon" href="school_logo.png" />
<script>(function(){try{var t=localStorage.getItem('expo_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#171411':'#f4f1e9';}catch(e){document.documentElement.dataset.theme='light';}})()</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<nav class="nav"><div class="container" id="nav"></div></nav>
<main class="container" style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px">
  <div class="kicker" style="justify-content:center">Error</div>
  <h1 style="font-family:'DM Serif Display',serif;font-size:clamp(40px,8vw,88px);line-height:.95;margin:12px 0;color:var(--danger)">Something went wrong</h1>
  <p style="color:var(--muted);max-width:460px;margin:12px auto 28px">We couldn't complete your request. Please try again, or contact the exhibition organizers if the problem persists.</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <a class="btn btn-primary btn-lg" href="javascript:history.back()">Try again</a>
    <a class="btn btn-ghost btn-lg" href="index.html">Back to home</a>
  </div>
</main>
<footer class="footer" id="footer"></footer>
<script src="js/store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script src="js/app.js"></script>
<script>
  ExpoUI.renderNav(document.getElementById('nav'));
  ExpoUI.renderFooter(document.getElementById('footer'));
</script>
</body>
</html>
