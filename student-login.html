<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Portal — Expo 2026</title>
<meta name="description" content="Sign in with Google or create a student account to submit your exhibition project and vote for the People's Choice Award." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="apple-touch-icon" href="school_logo.png" />
<script>(function(){try{var t=localStorage.getItem('expo_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#171411':'#f4f1e9';}catch(e){document.documentElement.dataset.theme='light';}})()</script>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
    background: var(--bg);
  }
  .auth-card {
    width: 100%;
    max-width: 480px;
    padding: 36px 32px;
  }
  .auth-tabs {
    display: flex;
    gap: 8px;
    background: var(--surface-2);
    padding: 5px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }
  .auth-tab-btn {
    flex: 1;
    padding: 10px 14px;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: calc(var(--radius) - 2px);
    transition: all .2s;
  }
  .auth-tab-btn.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .auth-notice {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--surface-2);
    border: 1px solid var(--border);
    margin-bottom: 22px;
    font-size: 12px;
    color: var(--muted);
  }
  .auth-notice svg {
    flex-shrink: 0;
    color: var(--accent);
  }
  .auth-err {
    display: none;
    background: rgba(168, 54, 43, 0.08);
    color: var(--danger);
    border: 1px solid rgba(168, 54, 43, 0.2);
    padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .auth-success {
    display: none;
    background: rgba(63, 115, 87, 0.08);
    color: var(--success);
    border: 1px solid rgba(63, 115, 87, 0.2);
    padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 18px;
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <div style="margin-bottom:24px;text-align:center">
    <a class="brand" href="index.html" style="justify-content:center">
      <span class="brand-mark"><img src="school_logo.png" alt="School logo" /></span>
      <span>Expo<span style="color:var(--accent-2)">2026</span></span>
    </a>
  </div>

  <div class="glass auth-card">
    <div style="margin-bottom:20px;text-align:center">
      <h1 style="font-size:26px;margin:0 0 6px" id="authTitle">Student Portal</h1>
      <p style="margin:0;color:var(--muted);font-size:13px" id="authSubtitle">Sign in to upload project exhibits and cast your vote.</p>
    </div>

    <!-- GOOGLE ONE-CLICK SIGN IN -->
    <div style="margin-bottom:22px">
      <a href="/api/auth/google" id="googleLoginBtn" class="btn btn-ghost" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;font-size:14px;border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;font-weight:500;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Sign in with Google
      </a>
      <div style="display:flex;align-items:center;margin:20px 0 6px;gap:12px;color:var(--muted);font-size:12px">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span>or use student credentials</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
    </div>

    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab-btn active" id="tabLogin" role="tab" aria-selected="true">Sign In</button>
      <button type="button" class="auth-tab-btn" id="tabRegister" role="tab" aria-selected="false">Create Account</button>
    </div>

    <div class="auth-notice">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <div>Each student account can upload submissions and cast <strong>exactly 1 vote</strong> for the People's Choice Award.</div>
    </div>

    <div class="auth-err" id="authErr"></div>
    <div class="auth-success" id="authSuccess"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field" style="margin-bottom:14px">
        <label for="l-email">Student Email *</label>
        <input id="l-email" name="email" type="email" required placeholder="you@school.edu" autocomplete="email" />
      </div>
      <div class="field" style="margin-bottom:20px">
        <label for="l-password">Password *</label>
        <div class="input-with-action">
          <input id="l-password" name="password" type="password" required placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="input-action-btn" id="toggleLoginPass" title="Show / Hide password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit" id="loginBtn">Sign In</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none">
      <div class="field" style="margin-bottom:14px">
        <label for="r-name">Full Name *</label>
        <input id="r-name" name="name" required placeholder="e.g. Alex Rivera" autocomplete="name" />
      </div>
      <div class="field" style="margin-bottom:14px">
        <label for="r-grade">Grade / Class *</label>
        <input id="r-grade" name="grade" required placeholder="e.g. Grade 11-A" />
      </div>
      <div class="field" style="margin-bottom:14px">
        <label for="r-email">Student Email *</label>
        <input id="r-email" name="email" type="email" required placeholder="alex@school.edu" autocomplete="email" />
      </div>
      <div class="field" style="margin-bottom:14px">
        <label for="r-password">Password *</label>
        <div class="input-with-action">
          <input id="r-password" name="password" type="password" required placeholder="At least 6 characters" minlength="6" autocomplete="new-password" />
          <button type="button" class="input-action-btn" id="toggleRegPass" title="Show / Hide password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <div class="field" style="margin-bottom:20px">
        <label for="r-confirm">Confirm Password *</label>
        <input id="r-confirm" name="confirmPassword" type="password" required placeholder="Repeat password" minlength="6" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit" id="regBtn">Create Student Account</button>
    </form>

    <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--muted)">
      <a href="index.html" style="color:var(--muted);margin-right:12px">← Return to Home</a>
      <a href="admin.html" style="color:var(--muted)">Admin Portal →</a>
    </div>
  </div>
</div>

<div class="toast-wrap"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  const S = window.ExpoStore;
  const rawRedirect = new URLSearchParams(location.search).get('redirect') || '/projects.html';
  const redirect = rawRedirect.startsWith('/') ? rawRedirect : '/' + rawRedirect;
  const urlError = new URLSearchParams(location.search).get('error');

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');
  const errBox = document.getElementById('authErr');
  const successBox = document.getElementById('authSuccess');

  if (urlError) {
    errBox.textContent = decodeURIComponent(urlError);
    errBox.style.display = 'block';
  }

  function showTab(tab) {
    errBox.style.display = 'none';
    successBox.style.display = 'none';
    if (tab === 'register') {
      tabLogin.classList.remove('active');
      tabLogin.setAttribute('aria-selected', 'false');
      tabRegister.classList.add('active');
      tabRegister.setAttribute('aria-selected', 'true');
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
      authTitle.textContent = 'Create Student Account';
      authSubtitle.textContent = 'Register once to upload exhibits and vote for projects.';
    } else {
      tabRegister.classList.remove('active');
      tabRegister.setAttribute('aria-selected', 'false');
      tabLogin.classList.add('active');
      tabLogin.setAttribute('aria-selected', 'true');
      registerForm.style.display = 'none';
      loginForm.style.display = 'block';
      authTitle.textContent = 'Student Sign In';
      authSubtitle.textContent = 'Access your project submissions and vote for awards.';
    }
  }

  tabLogin.addEventListener('click', () => showTab('login'));
  tabRegister.addEventListener('click', () => showTab('register'));

  // If already logged in, redirect
  S.ready().then(() => {
    if (S.isStudentLoggedIn()) {
      location.replace(redirect);
    }
  });

  // Password toggles
  function setupPassToggle(btnId, inputId) {
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    btn.addEventListener('click', () => {
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      btn.querySelector('.eye-icon').innerHTML = isPass
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });
  }
  setupPassToggle('toggleLoginPass', 'l-password');
  setupPassToggle('toggleRegPass', 'r-password');

  // Google OAuth button setup (Server-Side Flow)
  const googleBtn = document.getElementById('googleLoginBtn');
  if (googleBtn) {
    googleBtn.href = `/api/auth/google?redirect=${encodeURIComponent(redirect)}`;
  }

  // Login handler
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const fd = new FormData(loginForm);
    const email = fd.get('email');
    const password = fd.get('password');

    try {
      const res = await S.studentLogin(email, password);
      if (res && res.success) {
        successBox.textContent = `Welcome back, ${res.student.name}! Redirecting...`;
        successBox.style.display = 'block';
        setTimeout(() => location.href = redirect, 800);
      } else {
        errBox.textContent = (res && res.error) || 'Invalid email or password.';
        errBox.style.display = 'block';
      }
    } catch (ex) {
      errBox.textContent = ex.message || 'Connection error. Please try again.';
      errBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  // Register handler
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    const btn = document.getElementById('regBtn');

    const fd = new FormData(registerForm);
    const name = fd.get('name');
    const grade = fd.get('grade');
    const email = fd.get('email');
    const password = fd.get('password');
    const confirm = fd.get('confirmPassword');

    if (password !== confirm) {
      errBox.textContent = 'Passwords do not match.';
      errBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const res = await S.studentRegister({ name, grade, email, password });
      if (res && res.success) {
        successBox.textContent = `Account created successfully! Welcome, ${res.student.name}.`;
        successBox.style.display = 'block';
        setTimeout(() => location.href = redirect, 900);
      } else {
        errBox.textContent = (res && res.error) || 'Registration failed.';
        errBox.style.display = 'block';
      }
    } catch (ex) {
      errBox.textContent = ex.message || 'Connection error. Please try again.';
      errBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Student Account';
    }
  });
</script>
</body>
</html>
