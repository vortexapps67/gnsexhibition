<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schedule — Expo 2026</title>
<meta name="description" content="Key dates for Expo 2026: submissions open, panel review, revision window, exhibition day and the awards ceremony." />
<meta property="og:title" content="Schedule — Expo 2026" />
<meta property="og:description" content="The road to expo — every key date in one place." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#f4f1e9" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="apple-touch-icon" href="school_logo.png" />
<script>(function(){try{var t=localStorage.getItem('expo_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#171411':'#f4f1e9';}catch(e){document.documentElement.dataset.theme='light';}})()</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<nav class="nav"><div class="container" id="nav"></div></nav>

<section class="page-intro">
  <div class="container">
    <span class="page-index" aria-hidden="true">03</span>
    <div class="kicker">Timeline</div>
    <h1>The road to expo</h1>
    <p>Key dates from the first submission to the awards ceremony. Plan your involvement and don't miss a milestone.</p>
  </div>
</section>

<section class="section" style="padding-top:20px">
  <div class="container">
    <h2 class="sr-only">Key dates</h2>
    <div class="timeline stagger" id="scheduleTimeline"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="glass cta-panel stagger" style="padding:48px;text-align:center">
      <div class="kicker" style="justify-content:center">Ready?</div>
      <h2 style="font-size:clamp(30px,4vw,48px)">Have a project to show?</h2>
      <p style="color:var(--muted);max-width:500px;margin:12px auto 24px">Submit before the deadline and we'll take care of the rest.</p>
      <a class="btn btn-primary btn-lg" href="submit.html">Submit a Project</a>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script src="js/store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script src="js/app.js"></script>
<script>
  ExpoUI.renderNav(document.getElementById('nav'));
  ExpoUI.renderFooter(document.getElementById('footer'));

  (async function loadSchedule() {
    const container = document.getElementById('scheduleTimeline');
    if (!container) return;
    let schedule = [];
    try {
      const res = await fetch('/api/admin/settings');
      if (res.ok) {
        const data = await res.json();
        schedule = (data.settings && Array.isArray(data.settings.schedule)) ? data.settings.schedule : [];
      }
    } catch (e) { console.error('schedule fetch failed', e); }
    if (!schedule.length) {
      schedule = [
        { id:'s1', date:'2026-11-12', time:'', label:'Submissions open', note:'Students can start submitting projects.' },
        { id:'s2', date:'2026-11-30', time:'23:59', label:'Submission deadline', note:'All project details must be submitted by 11:59 PM.' },
        { id:'s3', date:'2026-12-01', time:'', label:'Panel review begins', note:'Faculty review period starts.' },
        { id:'s4', date:'2026-12-05', time:'', label:'Review complete', note:'All projects reviewed.' },
        { id:'s5', date:'2026-12-08', time:'', label:'Revision window', note:'Students address feedback.' },
        { id:'s6', date:'2026-12-12', time:'09:00', label:'Exhibition day', note:'Doors open at 9 AM.' },
        { id:'s7', date:'2026-12-12', time:'17:00', label:'Awards ceremony', note:'Best Innovation, Best Design, Best Social Impact, People\'s Choice.' }
      ];
    }
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtDate(d) {
      if (!d) return '';
      const parts = d.split('-');
      if (parts.length !== 3) return d;
      const m = months[parseInt(parts[1],10)-1] || parts[1];
      const day = parseInt(parts[2],10);
      return m + ' ' + day;
    }
    container.innerHTML = schedule.map(s => `
      <div class="timeline-item">
        <div class="timeline-date">${escapeHTML(fmtDate(s.date))}${s.time ? '<span>'+escapeHTML(s.time)+'</span>' : ''}</div>
        <div class="timeline-body">
          <h3>${escapeHTML(s.label || '')}</h3>
          <p>${escapeHTML(s.note || '')}</p>
        </div>
        <div class="timeline-tag">${escapeHTML(s.time || 'Milestone')}</div>
      </div>
    `).join('');
  })();

  function escapeHTML(str) { return String(str).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])); }
</script>
</body>
</html>
