<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAQ — Expo 2026</title>
<meta name="description" content="Answers to common questions about submitting, reviewing and showcasing a project at Expo 2026, the annual school exhibition." />
<meta property="og:title" content="FAQ — Expo 2026" />
<meta property="og:description" content="Everything you need to know about Expo 2026." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#f4f1e9" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="apple-touch-icon" href="school_logo.png" />
<script>(function(){try{var t=localStorage.getItem('expo_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#171411':'#f4f1e9';}catch(e){document.documentElement.dataset.theme='light';}})()</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<nav class="nav"><div class="container" id="nav"></div></nav>

<section class="page-intro">
  <div class="container">
    <span class="page-index" aria-hidden="true">05</span>
    <div class="kicker">Help</div>
    <h1>Frequently asked questions</h1>
    <p>Everything you need to know about submitting, reviewing and showcasing a project at Expo 2026.</p>
  </div>
</section>

<section class="section" style="padding-top:20px">
  <div class="container">
    <div class="accordion" id="accordion"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="glass cta-panel stagger" style="padding:48px;text-align:center">
      <div class="kicker" style="justify-content:center">Still unsure?</div>
      <h2 style="font-size:clamp(30px,4vw,48px)">Ready to submit your project?</h2>
      <p style="color:var(--muted);max-width:500px;margin:12px auto 24px">The form takes a few minutes. You can update details later through the admin review process.</p>
      <a class="btn btn-primary btn-lg" href="submit.html">Start a Submission</a>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script src="js/store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script src="js/app.js"></script>
<script>
  ExpoUI.renderNav(document.getElementById('nav'));
  ExpoUI.renderFooter(document.getElementById('footer'));

  const faqs = [
    ['Who can submit a project?', 'Any student currently enrolled at the school can submit a project, individually or as part of a team. There is no limit on the number of submissions per student.'],
    ['What kinds of projects are accepted?', 'We welcome projects across robotics, AI, web, mobile, IoT, science, art, design and games. If your work does not fit an existing category, choose "Other" and describe it clearly.'],
    ['When is the submission deadline?', 'Submissions close on November 30 at 11:59 PM. Check the schedule page for the full timeline including review and revision dates.'],
    ['What happens after I submit?', 'Your project enters the review queue with a "pending" status. The review panel checks it against the judging criteria and either approves it or returns feedback for revision.'],
    ['Can I edit my project after submitting?', 'Yes. Contact the exhibition committee with your project title and the changes you need. Approved projects can also be updated during the revision window.'],
    ['What do I need for the project image?', 'A hosted image URL works best. You can use any public image link, or add your own artwork to the assets folder and reference it by path if you are hosting the site yourself.'],
    ['How are projects approved or rejected?', 'The admin panel lets reviewers approve, reject with a note, edit details, delete entries and feature outstanding work. Every decision is recorded in the activity log.'],
    ['Will my contact details be displayed?', 'Only your name, grade, project description and tags appear on the public gallery. Email is shown on the detail page for approved projects and can be removed on request.']
  ];

  const box = document.getElementById('accordion');
  box.innerHTML = faqs.map((f, i) => `
    <div class="acc-item ${i === 0 ? 'open' : ''}">
      <button class="acc-trigger" type="button">
        <span>${f[0]}</span><span class="acc-sign"></span>
      </button>
      <div class="acc-panel"><div class="acc-panel-inner">${f[1]}</div></div>
    </div>`).join('');

  box.querySelectorAll('.acc-trigger').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.parentElement;
      const isOpen = item.classList.contains('open');
      box.querySelectorAll('.acc-item').forEach(x => x.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });
  });
</script>
</body>
</html>
